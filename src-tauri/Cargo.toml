# Member of the repo-root Cargo workspace (../Cargo.toml). The v3 MSRV-aware
# resolver + the 1.82 floor live at the workspace root now — needed for the
# iroh→netwatch→wmi chain to resolve a consistent windows-core alongside Tauri's
# windows deps (resolver 2 splits it and fails to compile).
[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# 1.82 floor: iroh's netwatch pins windows 0.62 (MSRV 1.82); below this, the
# MSRV-aware resolver splits wmi across windows 0.61/windows-core 0.62 and fails
# to compile. Our toolchain is 1.92.
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon: closing the window hides to the tray instead of quitting, so the
# Curator survives the surface being closed (src-tauri/src/tray.rs).
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
iroh = "1.0.1"
iroh-docs = "0.101"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "sync", "io-util"] }
# pin-sia: the shared Sia layer, the same crate the browser reaches through wasm —
# so the connect flow, the pinned-objects walk and the descriptor shapes have one
# definition rather than a Rust copy here and a TypeScript copy there. This file is
# now only Tauri plumbing: the runtime, the IPC framing, the command surface.
pin-sia = { path = "../crates/pin-sia" }
# pkarr itself only via pin-pkarr now (identity.rs still uses the crate directly for
# the Curator's own DID document; the generic TXT publish/resolve is shared).
pkarr = "3"
# Pin's pkarr layer, shared with the browser: one definition of the packet shape, TTL
# and retry posture, with only the transport differing by target (DHT here, relays there).
pin-pkarr = { path = "../crates/pin-pkarr" }
# Every AppKey-derived secret, identical to what the browser derives — the doc
# namespace/author seeds, the did:dht identity seed, and the rest. Owning the hkdf/sha2
# dependency here too would just be a second place for a derivation to drift.
pin-derive = { path = "../crates/pin-derive" }
# The /hey wire protocol, shared with the browser instance (pin-core serves the same
# ALPN) so the two can't drift apart.
pin-rpc = { path = "../crates/pin-rpc" }
