# Standalone workspace so we can opt into the v3 (MSRV-aware) dependency
# resolver — it picks a consistent windows-core for the iroh→netwatch→wmi chain
# alongside Tauri's windows deps, which resolver 2 splits and fails to compile.
[workspace]
resolver = "3"

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# 1.82 floor: iroh's netwatch pins windows 0.62 (MSRV 1.82); below this, the
# MSRV-aware resolver splits wmi across windows 0.61/windows-core 0.62 and fails
# to compile. Our toolchain is 1.92.
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
iroh = "1.0.1"
iroh-docs = "0.101"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "sync", "io-util"] }
atrium-repo = "0.1.8"
atrium-crypto = "0.1.3"
atrium-api = "0.25.8"
rand = "0.8"
sia_storage = "0.9.1"
hkdf = "0.12"
sha2 = "0.10"
pkarr = "3"
