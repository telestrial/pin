# Shared AppKey-derived seeds for the iroh-docs engine. The doc namespace + author
# keys are HKDF-derived from the Sia AppKey with the same domain-separated `info`s in
# both engines — the browser (pin-core, wasm) and the desktop keeper (src-tauri,
# native) — so the same recovery phrase lands on the same doc namespace on every
# device. These constants MUST match across both; one crate removes the drift risk.
# Pure hkdf+sha2, no iroh — builds on wasm and native alike.
[package]
name = "pin-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
# For `RecordKey` — the parsed record address both engines hand the frontend. The
# shape crosses the seam, so it needs one definition here rather than one per engine;
# serde builds on wasm and native alike, so the "no iroh" property above holds.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Pins `RecordKey`'s serialized field names, which the frontend destructures.
serde_json = "1"
