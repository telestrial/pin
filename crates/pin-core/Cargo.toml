[package]
name = "pin-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

# The shared doc engine. Built native (rlib, linked by the src-tauri keeper) and
# wasm32 (cdylib, via wasm-pack --target web for the browser). The record CRUD
# surface (open / put / get / delete / list, keyed by collection/rkey) is the
# "repo-as-only-contract" the app talks to in both environments — the atproto
# repo's replacement.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# rpc + fs-store OFF: rpc -> mio doesn't build on wasm; fs-store is the native redb
# store. B1 uses the in-memory store everywhere (browser is ephemeral for now; the
# native FsStore path returns in B2 when src-tauri adopts this crate).
iroh = "1.0.1"
iroh-docs = { version = "0.101", default-features = false }
iroh-blobs = { version = "0.103", default-features = false }
iroh-gossip = "0.101"
# Shared AppKey->doc-seed derivation (NS/AUTHOR info + hkdf32 + decode_app_key),
# identical to the native keeper's so both land on the same namespace.
pin-derive = { path = "../pin-derive" }
# The /hey wire protocol, shared with the native Curator so both instances answer
# ALPN pin-keeper/0 identically. A tab that's open is a full peer: it serves the same
# knock, just over the relay it already holds rather than a direct path.
pin-rpc = { path = "../pin-rpc" }
# Pin's pkarr layer — the signed DID/channel pointers. Shared with the native Curator
# so the packet shape, TTL and retry posture can't drift between a tab and a desktop;
# only the transport underneath differs (relays here, Mainline DHT there).
pin-pkarr = { path = "../pin-pkarr" }
# The engagement record. Signing it is pure, so the same binding serves a browser tab
# and the desktop shell; what it produces has to be byte-identical to what the Curator's
# fold reads back, which is why the record is defined once rather than per side.
pin-engagement = { path = "../pin-engagement" }
# Pin's Sia layer — bytes, custody and the connect flow. Shared with the desktop
# backend so the connect typestate and the pinned-objects walk are one definition;
# `sia_storage` brings its own per-target transport, so nothing here branches.
pin-sia = { path = "../pin-sia" }
# Content fingerprinting. Uploads carry their own hash back from pin-sia, so this is
# exposed only for bytes the app already holds — chiefly the integration tier's fake
# client, which needs the real hash for cache keys to behave as they do live.
pin-crypto = { path = "../pin-crypto" }
# The channel round-trip's sequencing — sealing under K, uploading, and signing the
# pointer, in the order that keeps a resolved pointer always backed by bytes.
pin-channel = { path = "../pin-channel" }
# The manifest and the rules for changing it. Shared with the Curator so publishing,
# editing and retracting mean the same thing wherever the user does them — and so the
# reference-safe cleanup, which decides which bytes get deleted, has one definition.
pin-manifest = { path = "../pin-manifest" }
# The Curator's loops. The browser runs the same ones the desktop does, for as long as
# its tab is open — the difference is uptime, not capability.
pin-curator = { path = "../pin-curator" }
serde = "1"
serde_json = "1"
futures-lite = "2"
# Browser glue (compiles harmlessly on native; the exports are just inert there).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"

# getrandom needs the js backend to build for wasm; native uses its default.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
