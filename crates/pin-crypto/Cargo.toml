# Pin's content-and-envelope cryptography, written once for both targets.
#
# Separate from pin-derive on purpose: that crate answers "what secret does this
# AppKey imply", this one answers "how are bytes fingerprinted and sealed". They
# share no dependency and neither needs the other, so folding them together would
# only make the names lie.
#
# Everything here is format-defining, which is the bar for living in a shared crate:
# a divergence between the browser's implementation and the Curator's would not be
# untidy, it would make one of them unable to read what the other wrote — of live
# manifests already on Sia, and of a cache key the whole item cache is built on.
[package]
name = "pin-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
# Already in the tree via pin-derive's HKDF.
sha2 = "0.10"
# AES-256-GCM. `default-features = false` is load-bearing, not tidiness: the default
# `getrandom` feature reaches rand_core 0.6 and getrandom 0.2, and getrandom 0.2 does
# not build for wasm32-unknown-unknown without a js feature nothing here enables. We
# generate the nonce ourselves anyway, so the RNG that feature exists to provide is
# unused. Version matches what iroh's rpc feature already pulls in natively.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# The blob's outer encoding, matching the `btoa`/`atob` pair it replaces: standard
# alphabet, with padding.
base64 = "0.23"
# The nonce. 0.4 is the version whose `wasm_js` backend the wasm build already selects
# (see scripts/build-wasm.sh) — deliberately NOT getrandom 0.2, which aes-gcm would
# have brought along.
getrandom = { version = "0.4", features = ["wasm_js"] }
# The sealed box's key agreement. 3.0 is the version sia_mux already pulls in, so this adds
# no second copy. `default-features = false` drops the precomputed basepoint tables, which
# cost wasm size for a few key agreements per pass; `static_secrets` is what lets a key be
# built from a derived seed rather than drawn from an RNG this crate does not hold.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
# The sealed box's key derivation from the shared secret. Already in the tree via
# pin-derive.
hkdf = "0.12"
